name: CI

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            spire_sha256: 7bcf5e167151a1fc58293768462b44e155ba8784214582aefa6adf18c633d1d5
          - arch: arm64
            runner: ubuntu-24.04-arm
            spire_sha256: ba2804905a27ca72b0478ae790b580ea26233abafac7e480bbaf54152d5c2c5b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust code
        run: |
          rustup show
          cargo fmt --all -- --check
          cargo clippy --locked --release --all-targets -- -D warnings
      - name: Build release binary
        run: cargo build --locked --release
      - name: Test with SPIRE
        env:
          ARCH: ${{ matrix.arch }}
          SPIRE_SHA256: ${{ matrix.spire_sha256 }}
        run: |
          version=1.16.0
          archive="spire-$version-linux-$ARCH-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/spiffe/spire/releases/download/v$version/$archive" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$SPIRE_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          python3 tests/integration.py target/release/exordos-link "$RUNNER_TEMP/spire-$version/bin"
          python3 -m venv "$RUNNER_TEMP/grpc-test"
          # grpcio is an Apache-2.0 test-only dependency.
          "$RUNNER_TEMP/grpc-test/bin/python" -m pip install --only-binary=:all: grpcio==1.82.1
          "$RUNNER_TEMP/grpc-test/bin/python" tests/integration_grpc.py target/release/exordos-link "$RUNNER_TEMP/spire-$version/bin"
      - name: Package and check archives
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(dpkg --print-architecture)" = "$ARCH"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          bash packaging/build.sh target/release/exordos-link dist
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/deb"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          cmp target/release/exordos-link "$RUNNER_TEMP/deb/usr/bin/exordos-link"
          cmp target/release/exordos-link "$RUNNER_TEMP"/exordos-link_*_linux_"$ARCH"/exordos-link
          version=$(dpkg-deb --field dist/*.deb Version)
          test "$("$RUNNER_TEMP/deb/usr/bin/exordos-link" --version)" = "exordos-link $version"
          if [[ $GITHUB_REF_TYPE == tag ]]; then test "$GITHUB_REF_NAME" = "$version"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for arch in amd64 arm64; do
            test -s "exordos-link_${GITHUB_REF_NAME}_${arch}.deb"
            test -s "exordos-link_${GITHUB_REF_NAME}_linux_${arch}.tar.gz"
          done
          sha256sum ./*.deb ./*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes ./*.deb ./*.tar.gz SHA256SUMS
